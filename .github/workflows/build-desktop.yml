name: Build Desktop (Windows + macOS)

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows 桌面端 (.exe)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm 9 (bypass packageManager 8.9.0 strict)
        run: |
          npm install -g pnpm@9
          echo "COREPACK_ENABLE_STRICT=0" >> $GITHUB_ENV
      # 不用 --frozen-lockfile（lockfile 跟 package.json 不同步，noble 是后加的）
      - name: pnpm install
        run: pnpm install --ignore-scripts --config.package-manager-strict=false
      - name: Rebuild noble for Electron + win32-x64
        run: |
          cd apps/desktop
          npm rebuild @abandonware/noble --runtime=electron --target=29.4.6 --dist-url=https://npmmirror.com/mirrors/electron/ --abi=125
      - run: cd apps/desktop && npx vite build && npx tsc -p electron/tsconfig.json
      - run: cd apps/desktop && npx electron-builder --win nsis --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: health-platform-windows-${{ github.sha }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
          if-no-files-found: warn

  build-macos:
    name: macOS 桌面端 (.zip · x64 + arm64)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm 9 (bypass packageManager 8.9.0 strict)
        run: |
          npm install -g pnpm@9
          echo "COREPACK_ENABLE_STRICT=0" >> $GITHUB_ENV
      - name: pnpm install
        run: pnpm install --ignore-scripts --config.package-manager-strict=false
      - name: Rebuild noble for Electron + darwin (universal)
        run: |
          cd apps/desktop
          npm rebuild @abandonware/noble --runtime=electron --target=29.4.6 --dist-url=https://npmmirror.com/mirrors/electron/ --abi=125
      - run: cd apps/desktop && npx vite build && npx tsc -p electron/tsconfig.json
      - run: cd apps/desktop && npx electron-builder --mac zip --x64 --arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: health-platform-macos-${{ github.sha }}
          path: |
            apps/desktop/release/*.zip
            apps/desktop/release/mac-*/健康管理系统.app
          if-no-files-found: warn
