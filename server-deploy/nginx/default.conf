# =====================================================================
# 健康管理系统 · Nginx 反向代理（生产优化版）
# 性能：gzip + brotli + HTTP/2 + 静态资源长缓存
# 安全：HSTS / CSP / X-Frame / X-Content-Type / SameSite
# 限流：API 30r/s；登录/验证码 5r/m；设备回调 60r/m
# 上游：NestJS @3000；wss @3000
# =====================================================================
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
  worker_connections 8192;
  use epoll;
  multi_accept on;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  # JSON 结构化日志，方便 ELK / SLS 收集
  log_format main escape=json '{'
    '"ts":"$time_iso8601",'
    '"remote":"$remote_addr",'
    '"req":"$request",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"rt":$request_time,'
    '"urt":"$upstream_response_time",'
    '"ref":"$http_referer",'
    '"ua":"$http_user_agent"'
  '}';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # ===== 基础性能 =====
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  keepalive_requests 1000;
  types_hash_max_size 2048;
  server_tokens off;
  server_names_hash_bucket_size 128;
  reset_timedout_connection on;

  # ===== 上传大小 =====
  client_max_body_size 50M;
  client_body_buffer_size 128k;
  client_header_buffer_size 4k;
  large_client_header_buffers 4 16k;

  # ===== 压缩（gzip + brotli）=====
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_disable "msie6";
  gzip_types
    text/plain text/css text/xml application/json application/javascript
    application/xml application/xml+rss application/atom+xml
    application/wasm image/svg+xml font/ttf font/otf;

  # brotli（需镜像含 nginx-module-brotli；不可用时注释掉）
  # brotli on;
  # brotli_comp_level 6;
  # brotli_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

  # ===== 限流 =====
  # 通用 API：每秒 30 个，突发 60
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  # 登录 / 验证码 / 发送类：每分钟 5 个
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
  # 设备回调：每分钟 60 个
  limit_req_zone $binary_remote_addr zone=device:10m rate=60r/m;
  # AI 解读：每分钟 10 个
  limit_req_zone $binary_remote_addr zone=ai:10m rate=10r/m;
  # 单 IP 并发连接上限
  limit_conn_zone $binary_remote_addr zone=conn:10m;
  limit_conn conn 50;

  # ===== 代理缓冲 =====
  proxy_buffer_size 16k;
  proxy_buffers 8 32k;
  proxy_busy_buffers_size 64k;
  proxy_temp_file_write_size 64k;

  # ===== upstream 集群（NestJS） =====
  upstream backend_cluster {
    server backend:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
  }

  # ===== HTTP → HTTPS 重定向 =====
  server {
    listen 80 default_server;
    server_name _;
    # 健康检查放行
    location = /health { return 200 "ok\n"; add_header Content-Type text/plain; }
    location / { return 301 https://$host$request_uri; }
  }

  # ===== 主站 HTTPS =====
  server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src "self"; img-src "self" data: https:; media-src "self" blob:; font-src "self" data:; script-src "self" "unsafe-inline" "unsafe-eval"; style-src "self" "unsafe-inline"; connect-src "self" wss: https:; frame-ancestors "self";" always;

    # 重用磁盘上的 gzip 文件（如有）
    gzip_static on;

    # ============ 静态资源（前端 H5 / 报告 / 字体）============
    location ~* \.(?:js|css|woff2?|ttf|otf|eot)$ {
      root /usr/share/nginx/html;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      add_header X-Content-Type-Options "nosniff" always;
      access_log off;
      try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|gif|webp|svg|ico)$ {
      root /usr/share/nginx/html;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000";
      access_log off;
      try_files $uri =404;
    }

    # ============ API 代理（鉴权 / 业务）============
    location /api/ {
      limit_req zone=api burst=60 nodelay;
      limit_req_status 429;

      proxy_pass http://backend_cluster;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_connect_timeout 5s;
      proxy_send_timeout 60s;
      proxy_read_timeout 120s;
    }

    # ============ 鉴权 / 验证码 / 登录（差异化限流）============
    location ~* ^/api/(auth/login|client/auth/send-code|captcha) {
      limit_req zone=auth burst=10 nodelay;
      limit_req_status 429;
      proxy_pass http://backend_cluster;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }

    # ============ AI 解读（差异化限流）============
    location ~* ^/api/(ai/interpret|care-plans/.*/generate-ai|client/.*interpret) {
      limit_req zone=ai burst=20 nodelay;
      limit_req_status 429;
      proxy_pass http://backend_cluster;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 180s;
    }

    # ============ 设备回调（差异化限流）============
    location /api/devices/callback/ {
      limit_req zone=device burst=120 nodelay;
      limit_req_status 429;
      proxy_pass http://backend_cluster;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }

    # ============ WebSocket（设备检测实时数据）============
    location /socket.io/ {
      proxy_pass http://backend_cluster;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 86400;
      proxy_send_timeout 86400;
    }

    # ============ H5 / 报告 SPA ============
    location / {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Pragma "no-cache" always;
    }

    # ============ 健康检查 ============
    location = /health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # ============ 错误页 ============
    error_page 429 /50x.html;
    error_page 502 503 504 /50x.html;
    location = /50x.html {
      root /usr/share/nginx/html;
      add_header Cache-Control "no-cache" always;
    }

    # ============ 防爬 / 防扫 ============
    location ~ /\.(git|svn|env|idea|vscode) { deny all; return 404; }
    location ~* /(wp-admin|wp-login|administrator) { deny all; return 404; }
  }
}


